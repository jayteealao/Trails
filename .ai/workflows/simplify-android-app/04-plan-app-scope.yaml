risks:
  - level: high
    title: "cleanup() in FirestoreSyncManager calls scope.cancel() — must NOT cancel the shared singleton"
    body: "FirestoreSyncManager.cleanup() currently calls scope.cancel(). After consolidation the scope is @Singleton and shared; cancelling it would silently kill all future coroutines in ArticleRepository and any other future consumer for the lifetime of the process. The cleanup() body must be changed to a no-op (or cancel only periodic WorkManager work, which it already does via cancelPeriodicSync())."
    mitigation: "Replace scope.cancel() with a comment; retain cancelPeriodicSync(). Add a comment warning that the shared scope must never be cancelled by any single consumer."

  - level: med
    title: "ArticleRepository.ioDispatcher is unused after scope injection — removing it breaks the constructor"
    body: "ioDispatcher is injected into ArticleRepositoryImpl but after the scope moves to injection it is only used in the private coroutineScope initialiser (being removed). If no other site in the impl uses ioDispatcher it becomes an orphaned @Dispatcher(IO) parameter. Removing it is safe but constitutes a secondary constructor change that also touches DataModule's @Binds resolution."
    mitigation: "Audit ArticleRepositoryImpl for any remaining ioDispatcher usage before removal. If found (e.g., a withContext(ioDispatcher) call), retain it. If not, remove to avoid dead parameter smell; Hilt will re-resolve cleanly since DataModule uses @Binds not @Provides."

  - level: med
    title: "CROSS-SLICE: ArticleRepository.kt and FirestoreSyncManager.kt constructors are shared with firestore-dedup and article-repository"
    body: "firestore-dedup (B1) edits FirestoreSyncManager body; article-repository (B3) edits ArticleRepositoryImpl body and may also adjust the constructor. Double-editing the same constructor in two slices causes a merge conflict if they are not sequenced properly. This slice (app-scope) must land and be merged BEFORE firestore-dedup and article-repository begin."
    mitigation: "Enforce sequencing in the recommended order: app-scope → firestore-dedup (5→6) and app-scope → article-repository (5→8). Document the cross-slice constructor dependency in each dependent slice's plan."

  - level: low
    title: "Supervised-isolation test relies on kotlinx-coroutines-test scheduler not real time"
    body: "The test creates a TestScope with StandardTestDispatcher; advanceUntilIdle() drives coroutines to completion. If the test accidentally mixes real Dispatchers.IO with the test dispatcher, the isolation assertion may pass trivially or race. No Firebase or WorkManager dependencies should appear in this test."
    mitigation: "Use only StandardTestDispatcher and TestScope throughout; explicitly assert scope.isActive rather than relying on timeout absence."
