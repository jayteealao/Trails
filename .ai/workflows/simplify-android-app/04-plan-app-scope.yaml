modules:
  - id: di-provider
    label: "@ApplicationScope qualifier + CoroutineScope provider"
    role: "New qualifier annotation and Hilt singleton CoroutineScope(SupervisorJob()+IO) provider installed in SingletonComponent; the single source of truth for long-lived background scopes"
  - id: scope-injection
    label: "Inject app scope into ArticleRepository + FirestoreSyncManager"
    role: "Hard-cutover constructor changes: remove bare CoroutineScope(ioDispatcher) from ArticleRepositoryImpl and CoroutineScope(SupervisorJob()+Dispatchers.IO) from FirestoreSyncManager; both receive the shared @ApplicationScope scope via Hilt injection"
  - id: supervised-isolation-test
    label: "Supervised-isolation unit test"
    role: "Verify that a child coroutine throwing does not cancel siblings and does not tear down the shared scope; test runs entirely in kotlinx-coroutines-test without live Firebase"

