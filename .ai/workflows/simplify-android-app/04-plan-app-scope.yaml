    status: new
    role: test
    delta: { add: 60, rem: 0 }
    planned_change:
      intent: "New JUnit unit test using kotlinx-coroutines-test: (1) create a TestScope with SupervisorJob()+StandardTestDispatcher; (2) launch a child that throws IllegalStateException; (3) advanceUntilIdle(); (4) assert scope.isActive == true and that a sibling child launched after the failure completes normally — proving supervised isolation; (5) assert scope is NOT cancelled after child failure; do NOT call scope.cancel() to confirm app-lifetime behaviour. No MockK / Firebase dependencies. Gradle task: :app:testDebugUnitTest"

