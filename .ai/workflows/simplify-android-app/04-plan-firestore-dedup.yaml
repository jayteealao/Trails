risks:
  - level: high
    title: "Over-eager dedup: tag-backup inline batch vs backupArticle differ in scope"
    body: "The inline tag-backup in syncLocalChanges() (lines 288-316) writes ONLY tags (no images/authors/domainMetadata) and uses a raw firestore.batch() against hard-coded collection strings. backupArticle() writes all related data + markers in one batch. Delegating is correct (adds marker writes atomically) but changes the per-article Firestore write count. Verify the test-net characterization test for the N+1 tag-batch quirk still passes (it asserts batch count = N articles; after delegation it asserts backupArticle called N times — update the assertion comment per plan step)."
  - level: med
    title: "Constant visibility: USERS_COLLECTION duplicated in FirestoreSyncManager companion"
    body: "FirestoreSyncManager.companion defines USERS_COLLECTION and ARTICLES_COLLECTION (lines 72-74). These duplicate FirestoreBackupService.companion. FirestoreSyncManager still references them directly in the tag-backup inline block and pushLocalArticle(). After extracting addArticleToBatch / delegating to backupArticle, those direct references go away — then the SyncManager constants can be deleted. Sequence: remove inline usage FIRST, then delete the constants."
  - level: low
    title: "withAuthenticatedUser{} placement: private vs internal"
    body: "The helper is needed in both files. If it is private to FirestoreBackupService, FirestoreSyncManager cannot reuse it. Place it as a private extension on each file separately (two declarations of the same pattern) OR lift to a package-private inline fun in a new FirestoreAuthHelpers.kt. Given the slice is behaviour-preserving, prefer two private declarations (no new file) and accept the single duplication — the helper body is 3 lines and the value is at the call sites, not the helper itself."
