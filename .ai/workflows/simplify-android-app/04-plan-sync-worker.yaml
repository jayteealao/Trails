risks:
  - level: med
    title: "join() must preserve timeout/cancellation the delay-poll implicitly provided"
    body: "The old poll checked hadErrors every 5s and returned early on cancellation (isActive check in while condition). A bare syncJob.join() suspends indefinitely if the job hangs. Mitigation: wrap in withTimeout(30_000) matching the WorkManager task deadline; on TimeoutCancellationException cancel syncJob and return Result.failure() to allow WorkManager to reschedule."
  - level: low
    title: "Paginating non-metrics articles must not change which articles are processed"
    body: "The existing query is WHERE resolved = 2 OR resolved = 1; pagination must use ORDER BY timeAdded DESC (or a stable column) to avoid row skips or double-processing across pages. Page size 50 matches the unresolved-articles chunk already used in the same repopulateJob for consistency."
  - level: low
    title: "Deleting syncArchivesInBackground removes the only in-worker raw getInstance() site in SyncWorker"
    body: "Confirmed via grep: the getInstance() at SyncWorker.kt:203 lives entirely inside syncArchivesInBackground, which is already commented out at the call site (line 156). ArchiveService (already @Inject-ed at line 71) provides the same functionality via the live syncArchives() method. Delete both the method and its caller comment."
