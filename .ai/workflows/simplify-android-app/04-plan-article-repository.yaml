risks:
  - level: high
    title: "CROSS-SLICE: constructor is shared with app-scope — sequence strictly after app-scope"
    body: "ArticleRepositoryImpl constructor is edited by app-scope (A4) to inject @ApplicationScope CoroutineScope and remove ioDispatcher. This slice extends that post-app-scope constructor. If B3 edits land before app-scope, a three-way merge conflict results. The post-app-scope constructor shape must be known before B3 implements."
    mitigation: "Enforce order: app-scope merged first, article-repository patches the resulting constructor shape. Both plans document this dependency explicitly."

  - level: med
    title: "Bulk upsert semantics: upsertArticles(List) must preserve upsert-by-URL behaviour of the current per-item upsertArticle"
    body: "The current add() loop calls articleDao.upsertArticle(articleToAdd) per item. upsertArticle is annotated @Upsert, which uses the primary-key-based conflict resolution from Room. The URL-dedup path (upsertNewArticle) is NOT called in add() — so the current semantics are already primary-key-based @Upsert, not URL-dedup. Replacing N calls to upsertArticle with one upsertArticles(List) call preserves semantics exactly (both are @Upsert; Room 2.8 @Upsert(List) is auto-transactional and uses the same conflict strategy)."
    mitigation: "Confirm @Upsert annotation on both upsertArticle and upsertArticles in ArticleDao before patching. Do NOT route through upsertNewArticle — that would change conflict semantics."

  - level: low
    title: "searchWithScore is owned by fts-search-fix — do not touch it"
    body: "ArticleRepository.kt also contains searchWithScore (the FTS bug). B3 must not modify that method; fts-search-fix (A1) owns it. If both slices edit the same file, sequence A1 before B3 to avoid merge churn."
    mitigation: "B3 edits only the constructor, delete(), and add(). Keep diff surgical."

  - level: low
    title: "Per-datum associated inserts (images, videos, tags, authors, domainMetadata) stay per-datum"
    body: "The efficiency-10 finding targets the per-article upsertArticle call only. The five associated insert calls (insertArticleImages, insertArticleVideos, insertArticleTags, insertArticleAuthors, insertDomainMetadata) are already List-based and must remain per-datum (each ArticleData owns its own images/tags/etc). Bulk-collecting them would require a flat-map and out-of-scope complexity."
    mitigation: "Only the Article transform + upsert is batched. The second forEach for associated data is unchanged."
