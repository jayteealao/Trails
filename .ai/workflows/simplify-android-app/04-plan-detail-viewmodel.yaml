    planned_change:
      intent: >
        (quality-4) Replace the 9-element array combine() + @Suppress("UNCHECKED_CAST") block with two nested
        combine() groups (article-group: _article+_selectedTabIndex+useFreediumFlow+_isLoading and
        archive-group: _remoteArchives+_localArchives+_archiveSyncing+_textSource+_selectedArchiveContent),
