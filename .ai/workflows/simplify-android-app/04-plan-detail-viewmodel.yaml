        constructor calls; inject UrlModifier as a constructor parameter (Hilt injects the @Singleton
        instance). (reuse-11) Replace hardcoded "readability"/"markdown" strings in autoPopulateText()
        with ArchiveType.READABILITY.archiveKey and ArchiveType.MARKDOWN.archiveKey.
