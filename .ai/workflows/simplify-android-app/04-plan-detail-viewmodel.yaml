risks:
  - level: low
    title: "Nested combine() group boundary must preserve emission semantics"
    body: >
      The intermediate data classes for the two combine groups introduce one extra allocation per
      emission cycle but do not change which values trigger re-emission (all 9 flows still
      participate). Verify: if any flow emits, the outer combine() re-runs and a new ArticleDetailState
      is produced — identical to the current flat combine() behaviour. Pin with the state-assembly test.
  - level: low
    title: "SettingsPreferenceKeys import crosses screen package boundary"
    body: >
      SettingsPreferenceKeys lives in screens/settings/. Importing it into screens/articleDetail/
      creates an intra-screens cross-package dependency. Acceptable per existing codebase conventions
      (SettingsViewModel already uses it from the same package); no structural refactor needed.
  - level: low
    title: "UrlModifier @Singleton requires Hilt to see the annotation before first use"
    body: >
      If UrlModifier is only annotated @Singleton without a @Provides binding in a Hilt module,
      Hilt will still inject it correctly because it has an @Inject constructor. Verify by running
      the Hilt component graph check (Gradle compileDebugKotlin). If the check fails, add the
      CommonModule binding as planned.
