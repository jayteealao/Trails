files:
  - path: android/app/src/main/java/com/jayteealao/trails/data/ArticleRepository.kt
    status: modified
    role: bug-fix
    delta: { add: 1, rem: 1 }
    planned_change:
      intent: >
        In searchWithScore, replace the raw `query` argument passed to
        articleDao.searchArticlesWithMatchInfo() with `sanitizedQuery` (already computed on
        the line above). This is the one-line fix: change `searchArticlesWithMatchInfo(query)`
        to `searchArticlesWithMatchInfo(sanitizedQuery)`. Do NOT touch sanitizeSearchQuery(),
        calculateScore(), delete(), add(), or the constructor — this slice is limited to the
        single call-site fix in searchWithScore.

  - path: android/app/src/test/java/com/jayteealao/trails/data/FtsSearchTest.kt
    status: new
    role: test
    delta: { add: 120, rem: 0 }
    planned_change:
      intent: >
        New JVM unit test class (no Hilt, no Room — use MockK to stub ArticleDao
        and a real ArticleRepositoryImpl wired with a test ioDispatcher via
        StandardTestDispatcher). Pin the INTENDED post-fix semantics for every
        edge case: (1) plain word → sanitized to *"**word**"* and passed to DAO,
        (2) unbalanced quote → internal quotes escaped, expression remains valid,
        (3) lone `*` wildcard → escaped inside phrase, no FTS special meaning leaks,
        (4) FTS operators AND/OR/NEAR as literal text → escaped inside phrase quotes,
        (5) empty string → searchWithScore returns emptyList() without calling DAO,
        (6) whitespace-only → sanitized to non-crashing expression (empty or trimmed),
        (7) non-ASCII / Unicode → passes through sanitizeSearchQuery unchanged and reaches DAO.
        Each test verifies via `coVerify { articleDao.searchArticlesWithMatchInfo(expectedSanitized) }`.
        Tests depend on the revived DB harness from test-net for the compile environment
        but do NOT require an in-process Room DB — MockK suffices.

edges:
