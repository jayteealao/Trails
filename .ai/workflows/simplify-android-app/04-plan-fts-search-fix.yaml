risks:
  - level: med
    title: "Result-set change is intentional — not a regression"
    body: >
      Routing the sanitized+wildcard query to the DAO will change which rows are returned
      for queries containing FTS-special chars (quotes, *, AND/OR/NEAR). Reviewers must
      treat any pre/post diff in returned rows as the INTENDED correction, not a regression.
      The new FTS tests pin the post-fix behaviour; pre-fix behaviour must NOT be pinned.
  - level: low
    title: "sanitizeSearchQuery double-wraps wildcards"
    body: >
      searchWithScore calls sanitizeSearchQuery("*$query*"), which itself wraps the
      result in *"..."*. The intended final expression is *"*<escaped-query>*"*. Verify
      the composed expression is a valid FTS4 MATCH pattern and does not produce an
      overly-broad or empty match for typical queries. Confirm with the edge-case tests.
  - level: low
    title: "Callers: searchLocal and ArticleSearchViewModel"
    body: >
      searchLocal() delegates entirely to searchWithScore(); ArticleListViewModel and
      ArticleSearchViewModel call searchLocal(). No caller signature changes — hard
      cutover is entirely internal to searchWithScore. No caller update required.
