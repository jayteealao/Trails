risks:
  - level: med
    title: "TestDatabaseModule revival may surface a larger Hilt graph break"
    body: "The original module was disabled before the ArticleRepositoryImpl constructor grew dependencies (SyncStatusMonitor, FirestoreSyncManager, ioDispatcher). Reviving it requires providing all constructor deps; if Hilt singleton scoping conflicts with the test component, the fix balloons. Scope: repair only what the net requires; record a deferral with reason if it exceeds ~2h."
    mitigation: "Prefer MockK constructor injection over a full Hilt in-memory graph; if TestDatabaseModule revival is blocked, descope it to a plain unit test and document."

  - level: med
    title: "FirestoreSyncManager is hard to unit-test: uses ad-hoc CoroutineScope + WorkManager"
    body: "FirestoreSyncManager creates its own CoroutineScope(SupervisorJob() + Dispatchers.IO) and calls WorkManager.getInstance(context) directly. These make scheduling and concurrency non-deterministic in plain JUnit tests. The characterization tests must mock or stub around them."
    mitigation: "Pass a TestCoroutineScheduler-backed scope via constructor; mock WorkManager at call sites using MockK object-level mocking (mockkObject/every); pin only the functions exercised in characterization — schedulePeriodicSync/cancelPeriodicSync are out of scope for this slice."

  - level: low
    title: "Characterization tests must pin current quirks, not fix them"
    body: "The tag-backup N+1 batch (one batch per article per chunk) and restoreAllArticlesPaginated accumulating all pages into memory are the exact quirks firestore-dedup/streaming-restore will fix. If tests are written against the 'ideal' behaviour they will fail on the current code."
    mitigation: "Assert the as-is batch count and list accumulation; include explicit comments noting which tests are expected to change when firestore-dedup/streaming-restore land."
