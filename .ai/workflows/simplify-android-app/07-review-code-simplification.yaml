    confidence: High
    action: simplify
    msg: >
      markerKeysFor(article) is called twice per article in the new backupArticlesPaginated body:
      once to estimate the write count (.size) and once inside addMarkerWrites (.forEach).
      Both calls produce the same deterministic list, so the first allocation is redundant.
    evidence: |
      val articleWrites = 1 + largeTextWrites + tags.size + markerKeysFor(article).size
      // …later…
      addMarkerWrites(batch, user.uid, article)  // internally calls markerKeysFor again
    fix: >
      Cache the result: val markerKeys = markerKeysFor(article)
      val articleWrites = 1 + largeTextWrites + tags.size + markerKeys.size
      Then pass markerKeys to a new overload of addMarkerWrites, or inline the marker
      writes using the cached list. The saving is trivial per article but eliminates
      a subtle "two sources of truth" smell.
