    surfaced-at: "2026-07-10T23:44:43Z"
    last-seen-at: "2026-07-10T23:44:43Z"
    msg: >
      In backupArticlesPaginated, each article allocates a full ByteArray via
      article.text?.toByteArray()?.size just to compute a write-count estimate
      (largeTextWrites), then addArticleToBatch() recomputes the same ByteArray
      internally at line 89. For large-text articles this is two allocations of
      up to ~900 KB each per article in the backup loop.
    fix: >
      Pre-compute textSize once and pass it into addArticleToBatch (or expose
      a size-only parameter). For the threshold check a char-count proxy
      (article.text?.length ?: 0) * 4 > MAX_TEXT_SIZE avoids the allocation
      entirely for the pre-check; the actual toByteArray() in addArticleToBatch
      can remain for correctness.
  - id: PE-4
    severity: low
    dimension: performance
    file: "android/app/src/main/java/com/jayteealao/trails/services/firestore/FirestoreSyncManager.kt"
    line: "569-575"
    confidence: med
    status: open
    surfaced-at: "2026-07-10T23:44:43Z"
    last-seen-at: "2026-07-10T23:44:43Z"
    msg: >
      reconcileNeverBackedUpArticles stamps backed_up_at with N individual
      updateBackedUpAt(itemId, now) calls inside chunk.forEach — one DB write
      per article (up to 20 per chunk). At chunk size 20 this is 20 Room
      transactions per sweep cycle. A bulk UPDATE ... WHERE itemId IN (ids)
      would be one transaction.
    fix: >
      Add ArticleDao.updateBackedUpAtBulk(itemIds: List<String>, timestamp: Long)
      with @Query("UPDATE article SET backed_up_at = :timestamp WHERE itemId IN (:itemIds)")
      and replace the forEach. The per-row try/catch for failure isolation can be
      dropped or moved to the single bulk call (a partial IN-update failure is
      already idempotent — the next reconcile sweep re-stamps).
  - id: PE-5
    severity: nit
    dimension: performance
    file: "android/app/src/main/java/com/jayteealao/trails/services/firestore/FirestoreBackupService.kt"
    line: "745"
    confidence: high
    status: open
    surfaced-at: "2026-07-10T23:44:43Z"
    last-seen-at: "2026-07-10T23:44:43Z"
    msg: >
      In the write-count-aware chunking loop, markerKeysFor(article) is called
      twice per article: once to get .size for articleWrites (line 745), and
      again inside addMarkerWrites() (line 165). The function is cheap (max 2
      strings), so impact is negligible — NIT only.
    fix: >
      val markerKeys = markerKeysFor(article); use markerKeys.size in articleWrites
      and pass markerKeys into addMarkerWrites() (or an overload that accepts it).
