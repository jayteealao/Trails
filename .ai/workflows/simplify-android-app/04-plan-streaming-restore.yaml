files:
  - path: android/app/src/main/java/com/jayteealao/trails/services/firestore/FirestoreBackupService.kt
    status: modified
    role: core-change
    delta: { add: 60, rem: 45 }
    planned_change:
      intent: >
        Replace restoreAllArticlesPaginated(onProgress) — which accumulates every page into
        allArticles: MutableList<Article> (the OOM bug) — with a new suspend function
        restoreAllArticlesPaginated(onProgress, onPage: suspend (List<Article>) -> Unit) that
        calls onPage(articles) per fetched page and never appends to a retained list. Inline
        the A2b large-text rehydration path (mirror of restoreArticle's null-text subcollection
        fetch) inside the per-page loop so each article whose text==null triggers a
        articles/{id}/text/content fetch before onPage is called. Remove the deprecated
        restoreAllArticles() fun entirely (no replacement shim — hard cutover). Keep the
        function signature suspend (not Flow) to preserve clean cancellation via structured
        concurrency: the caller's coroutineScope is the cancellation boundary, and the onPage
        callback gives the caller backpressure-by-convention (Room upsert blocks the loop
        until the DB write completes before fetching the next page). The onProgress
        callback signature (current: Int, total: Int) is unchanged.

  - path: android/app/src/main/java/com/jayteealao/trails/services/firestore/FirestoreSyncManager.kt
    status: modified
    role: caller-update
    delta: { add: 20, rem: 30 }
    planned_change:
      intent: >
        Update BOTH call sites of restoreAllArticlesPaginated (line ~427 in the
        first-sync restore branch; line ~492 in performBidirectionalSync) to supply an
        onPage lambda that calls handleRemoteArticleChange per article immediately, replacing
        the current fold { remoteArticles -> chunked(50) { ... } } accumulation pattern.
        Each article is upserted and has its tags fetched/merged in the onPage callback as it
        arrives; the outer chunked(50) loop is deleted. The onProgress callback is unchanged.
        No other callers of restoreAllArticles() exist (grep confirmed), so this completes
        the hard cutover. Remove all references to the removed deprecated restoreAllArticles().

  - path: android/app/src/test/java/com/jayteealao/trails/services/firestore/FirestoreBackupServiceTest.kt
    status: modified
    role: test
    delta: { add: 130, rem: 0 }
    planned_change:
      intent: >
        Add streaming-API tests (A2) and large-text rehydration test (A2b) to the existing
        test file. A2 tests: (1) each page's articles are passed to onPage as they arrive
        (assert onPage called N times for N pages, not once with the full list);
        (2) no list accumulation — verify onPage is called per page with page-size items,
        not once with total count; (3) zero articles — onPage never called, returns success;
        (4) single page (articles < RESTORE_PAGE_LIMIT) — onPage called exactly once;
        (5) onPage throws — propagates as Result.failure, stops paging (partial-restore state);
        (6) coroutine cancellation — cancelled scope before second page fetch results in no
        further onPage calls (cooperative cancellation via isActive / ensureActive).
        A2b tests: (7) article whose text==null in main doc triggers a fetch of
        articles/{id}/text/content subcollection and the rehydrated text is present in the
        Article passed to onPage; (8) article whose text is non-null is passed through
        without a subcollection fetch (no extra Firestore read). All tests use MockK +
        runTest + StandardTestDispatcher.

