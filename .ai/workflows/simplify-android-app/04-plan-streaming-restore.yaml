risks:
  - level: high
    title: "A2b adds N subcollection reads per large-text article in bulk restore path"
    body: >
      The single-article restoreArticle() already does this for correctness; the bulk path
      must too (A2b). However, every article with text==null will incur an extra Firestore
      GET inside the paging loop. For a library of 1000 articles where many had large text,
      this is 1000 extra reads. The fix is the correct behaviour (parity with restoreArticle),
      but the read cost is non-trivial. Note: batched tag reads (A3/batched-tag-reads slice)
      will later mitigate the analogous N+1 for tags; the A2b subcollection fetch is separate
      and not in that scope. Mitigation: proceed (correctness over read cost); the alternative
      is silently restoring articles with missing text, which is worse. Document the cost in
      the architecture doc (architecture-docs slice).
    mitigation: "Accept cost; document in architecture-docs. A3 addresses tags separately."

  - level: med
    title: "onPage failure leaves Room in partial-restore state"
    body: >
      If onPage throws mid-stream (e.g. Room constraint violation, disk full),
      restoreAllArticlesPaginated returns Result.failure and paging stops. Articles from
      already-delivered pages are already in Room; the session is in a partial-restore state
      with no rollback. The caller (FirestoreSyncManager) does not currently wrap the restore
      in a transaction. Re-running a sync will fill in missing articles (idempotent upsert),
      but there is a window where the UI shows incomplete data.
    mitigation: >
      Accept the partial-restore state (consistent with existing behaviour and safe for
      idempotent upsert); add a Timber.w log on failure and document the partial-restore
      contract in the function KDoc. Full transactional restore is a future improvement
      (not in this slice's scope).

  - level: med
    title: "suspend onPage callback vs Flow<List<Article>> — API shape decision"
    body: >
      Flow<List<Article>> would expose lazy pagination as a first-class stream but requires
      the two FirestoreSyncManager call sites to collect the flow inside a coroutine scope
      and handle backpressure via buffer()/conflate(). The existing call sites use fold {}
      which collapses to a single list — converting them to flow.collect {} adds boilerplate
      and makes the large remoteArticles.chunked(50) processing loop unnecessary (the flow
      emits page-sized chunks already). A suspend onPage callback is structurally equivalent
      (same cooperative cancellation, same backpressure-by-blocking), requires zero API surface
      change at the call site beyond swapping the fold {} for direct processing, and keeps
      the function return type as Result<Unit> (success/failure signalling unchanged).
      RECOMMENDATION: suspend onPage callback. See Proposed Change Strategy.
    mitigation: "Use suspend onPage callback; document the tradeoff."

  - level: low
    title: "Characterization test in test-net pins the OOM baseline — update required"
    body: >
      The test-net plan (04-plan-test-net.yaml) adds a characterization test asserting
      that restoreAllArticlesPaginated accumulates all pages into a single list (the current
      OOM quirk). This streaming-restore slice changes that behaviour, so the characterization
      test must be updated (or replaced by the new streaming-API tests) as part of this slice.
      If test-net is not yet implemented when this slice lands, there is no conflict; if it
      is implemented, the test update is required.
    mitigation: >
      Include the characterization test update in this slice's test step. The test comment
      already notes 'streaming-restore slice will fix; update test then'.
