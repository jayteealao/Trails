risks:
  - level: high
    title: "Must sequence strictly after article-repository (B3)"
    body: >
      `ArticleRepositoryImpl` constructor is modified by B3 (and by app-scope / A4 before it).
      This slice adds two more methods to the same file. Landing list-viewmodel before B3 causes
      a three-way merge conflict and risks building on a pre-B3 constructor shape. Hard gate:
      B3 merged and green before list-viewmodel implementation begins.
  - level: med
    title: "saveUrl() DAO sites: transaction and threading semantics must be preserved"
    body: >
      `upsertNewArticle` is a `@Transaction`-annotated DAO method (Room enforces atomicity at the
      DAO layer). The new repo method `saveNewArticle` must delegate directly to `articleDao.upsertNewArticle`
      without adding or removing a wrapping transaction. The undo-race guard (`getArticleById` +
      `updateUnfurledDetails`) runs on `ioDispatcher` inside `viewModelScope.launch(ioDispatcher)` —
      all three repo calls must remain on that same dispatcher path (no re-dispatch inside the impl).
  - level: med
    title: "ArticleListViewModel.kt overlaps cross-cutting-url (B9)"
    body: >
      B9 (cross-cutting-url) also touches `ArticleListViewModel.kt` — it replaces `normalizeUrl()`
      call sites with `Article.computeNormalizedUrl()`. Both slices edit `saveUrl()` and
      `insertArticle()`. Sequence list-viewmodel (B5) before cross-cutting-url (B9) or coordinate
      the merge carefully to avoid conflicts. Flag as a cross-slice overlap.
  - level: low
    title: "insertArticle() direct DAO call: move behind repo"
    body: >
      `insertArticle(article)` calls `articleDao.upsertArticle(...)` directly. This is a direct DAO
      site. The new `ArticleRepository` interface already has no matching method, so a new
      `suspend fun upsertArticle(article: Article)` pass-through is needed. Alternatively, the
      existing `add(List<ArticleData>)` method is not a fit (different type). The plan adds a
      minimal `upsertArticle(Article)` pass-through — this is part of the quality-11 broadening scope.
