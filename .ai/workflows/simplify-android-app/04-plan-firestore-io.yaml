risks:
  - level: med
    title: "Chunk-batch tag inclusion may exceed Firestore rules document-access budget"
    body: "WRITE_BATCH_LIMIT=20 was sized for one getAfter() per article (20 docs per batch = 20 access calls). Adding tag writes to the same batch does not add getAfter() calls (tags are subcollection docs, no rules access check). The budget concern is not breached. Confirm by reviewing the marker rules: only articleMarkers create/update requires a getAfter on the article doc — tag subcollection writes have no such rule."
  - level: med
    title: "Tag-in-chunk-batch changes the B1 characterization test assertion"
    body: "B1 updated the test to assert 'backupArticle() called N times'. B2 removes the backupArticle delegation in syncLocalChanges and folds tags into the chunk batch — the assertion must again be updated. Coordinate: do not implement B2 until the B1 characterization test is stable and the new assertion is documented in this plan."
  - level: low
    title: "getUserMetaDoc single-read: callers must not mutate or cache stale snapshots"
    body: "The helper reads the users/{uid} doc once per sync invocation and returns the DocumentSnapshot. If syncLocalChanges and performFullSync both call it independently, each gets one read. There is no cross-call cache — this is intentional (each sync call is independent). The win is within a single syncLocalChanges() call: two sequential .get() calls on the same doc collapse to one."
  - level: low
    title: "deleteAllTagsForArticle atomicity"
    body: "The single DELETE…WHERE itemId=? is auto-transactional in Room for a single-op suspend function. The subsequent insertArticleTags(tags) is a separate op — there is a window between delete and insert where tags are empty. This is the same window as the current per-tag loop. No semantic change; acceptable for a sync path that is not user-facing."
