risks:
  - level: med
    title: "handleRemoteArticleChange signature change requires all callers updated"
    body: "handleRemoteArticleChange is private but called from two sites (performBidirectionalSync and performFullSync Scenario 2). Both must be updated atomically in this slice — the test-net characterization tests pin the existing behaviour so any missed call site will fail the test suite before merge."
  - level: low
    title: "Chunk-size tuning: too large increases concurrency pressure; too small reduces batching benefit"
    body: "RESTORE_TAG_CHUNK_SIZE=10 is conservative: 10 parallel Firestore subcollection reads well within Android thread pool limits, and ceil(N/10) rounds ≤ N reads even for articles with 0 tags (empty Results counted as a read). Tune in implement if profiling shows a better value; cap at 30 to align with whereIn cap for future refactoring parity."
  - level: low
    title: "Articles with no tags still incur a Firestore read per chunk"
    body: "batchRestoreArticleTags issues one subcollection get() per article ID regardless of whether the article has tags — the only win is parallelism within each chunk. For pure no-tag libraries this halves wall-clock time (parallel) but does not reduce read count. Acceptable per A3 AC (sub-N+1 wall-clock reads via parallel dispatch; pure count reduction would require a different data model)."
