    msg: >
      upsertNewArticle merge-copy does not preserve backedUpAt from the existing
      row. When an already-backed-up article is re-added (e.g. via share intent),
      backedUpAt is reset to null, causing the article to appear in the next
      reconcile sweep and triggering an unnecessary Firestore re-upload. Already
      identified and tracked as a follow-up task by branch authors per the
      stamp-monotonicity audit in 06-verify-reconcile-stall-guard.md.
    evidence: "upsertArticle(newArticle.copy(...)) // backedUpAt not present in merge-copy fields (lines 502-530)"
    fix: "Add 'backedUpAt = existingArticle.backedUpAt' to the merge-copy in upsertNewArticle so already-backed-up rows retain their stamp on re-add."
