files:
  - path: android/app/src/main/java/com/jayteealao/trails/services/firestore/FirestoreSyncManager.kt
    status: modified
    role: domain
    module: sync-manager
    loc: 568
    delta: { add: 30, rem: 8 }
    planned_change:
      intent: "All three defect fixes: full-chunk-identity stall guard + MAX_RECONCILE_ITERATIONS cap + backlog-count start log in reconcileNeverBackedUpArticles(); sweep call inside the totalCount==0 zero-branch of syncLocalChanges(); backedUpAt stamped in both remote-won upsert copies in handleRemoteArticleChange()."
      diff: |
        @@ reconcileNeverBackedUpArticles() (lines 519-559) @@
        -        var prevChunkSize = -1
        +        var prevChunkIds: Set<String> = emptySet()
        +        var iterations = 0
        +        val backlog = articleDao.countArticlesNeverBackedUp()
        +        if (backlog > 0) Timber.d("reconcile: starting sweep, $backlog never-backed-up articles")
                 while (true) {
        +            if (++iterations > MAX_RECONCILE_ITERATIONS) { Timber.w(...); break }
                     val chunk = articleDao.getArticlesNeverBackedUp(RECONCILE_CHUNK_SIZE, 0)
                     if (chunk.isEmpty()) break
        -            if (chunk.size == prevChunkSize) {
        -                Timber.w("reconcile: no progress detected (chunk size $prevChunkSize unchanged)...")
        +            val chunkIds = chunk.mapTo(mutableSetOf()) { it.itemId }
        +            if (chunkIds == prevChunkIds) {
        +                Timber.w("reconcile: no progress detected (same ${chunkIds.size} rows returned)...")
                         break
                     }
        +            prevChunkIds = chunkIds
        @@ syncLocalChanges() zero-branch (lines 266-269) @@
                 if (totalCount == 0) {
                     Timber.d("No local changes to sync")
        +            reconcileNeverBackedUpArticles()
                     _syncStatus.value = SyncStatus.Success("Up to date")
        @@ handleRemoteArticleChange() remote-won branches (lines 97, 111) @@
        -            articleDao.upsertArticle(remoteArticle.copy(normalizedUrl = ...))
        +            articleDao.upsertArticle(remoteArticle.copy(normalizedUrl = ..., backedUpAt = System.currentTimeMillis()))
  - path: android/app/src/main/java/com/jayteealao/trails/data/local/database/ArticleDao.kt
    status: modified
    role: data
    module: dao
    delta: { add: 7, rem: 0 }
    planned_change:
      intent: "New countArticlesNeverBackedUp() @Query (COUNT over the same WHERE predicate as getArticlesNeverBackedUp) for the sweep-start backlog log."
      diff: |
        +    @Query("SELECT COUNT(*) FROM article WHERE backed_up_at IS NULL AND deleted_at IS NULL")
        +    suspend fun countArticlesNeverBackedUp(): Int
  - path: android/app/src/test/java/com/jayteealao/trails/services/firestore/FirestoreSyncManagerReconcileTest.kt
    status: modified
