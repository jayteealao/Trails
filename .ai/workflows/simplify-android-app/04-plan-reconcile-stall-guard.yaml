risks:
  - id: strict-mock-breakage
    severity: high
    title: "New DAO count call breaks existing strict-mock tests"
    body: "Both sync test classes use strict @MockK. Adding countArticlesNeverBackedUp() at sweep start and running the sweep in the zero-branch means existing tests that reach these paths fail with 'no answer found' until the new stub is added to their setup."
    mitigation: "Add the coEvery count stub to shared @Before setup in both test classes as the first test step; run the reconcile class in isolation before the full suite."
  - id: guard-weakening
    severity: high
    title: "Weakened stall guard could reintroduce an infinite loop"
    body: "Full-chunk identity only fires when the entire chunk repeats; a pathological interleaving that keeps rotating rows could evade it."
    mitigation: "MAX_RECONCILE_ITERATIONS=1000 hard cap bounds the loop absolutely; AC2 test pins termination after exactly 2 fetches of an identical page."
  - id: conflict-mask
    severity: med
    title: "Download-stamp must not mask local edits needing upload"
    body: "Stamping backedUpAt on the wrong branch would exclude a legitimately-newer local article from the sweep."
    mitigation: "Stamp only the two remote-won copy() sites; local-wins branch pushes via pushLocalArticle and is asserted unstamped in the AC4 companion test."
  - id: pr29-sequencing
    severity: low
    title: "The buggy guard is on open PR #29"
    body: "If PR #29 merges before this fix lands, the slice becomes a follow-up fix on main instead of a fixup on the branch."
    mitigation: "Ship decision, not a plan blocker; slice targets the same feat/simplify-android-app branch."
history: []
