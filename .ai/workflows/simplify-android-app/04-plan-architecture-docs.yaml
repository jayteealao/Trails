risks:
  - level: med
    title: "Docs drift if written before structural slices settle"
    body: "This slice has a hard dependency on firestore-dedup, firestore-io, streaming-restore, batched-tag-reads, and app-scope. If any of those plans change during implementation, the docs must be updated to reflect the final shipped shape — not the plan shape. Verify against the implemented code, not just the upstream plan files."
  - level: med
    title: "External Output Boundary leak"
    body: "The published docs must contain zero references to SDLC artifacts, workflow files, slice names, plan IDs, or any internal planning vocabulary. A dedicated leak-check step (grep for 'slice', 'sdlc', 'workflow', '04-plan', '03-slice', 'wf-') must pass before the docs are considered done."
  - level: low
    title: "collectionGroup reference confusion"
    body: "The reference doc covers the CLIENT-ONLY batched query shape. Any mention of collectionGroup must be limited to a brief 'why not' rationale (no userId field). Do not imply that an index or rules change exists — none was deployed."
