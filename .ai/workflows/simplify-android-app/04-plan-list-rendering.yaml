risks:
  - level: low
    title: "Removing vibrantColor from shadowsPlus must not change shadow rendering"
    body: "ArticleThumbnail uses vibrantColor.copy(alpha=0.6f) as the ShadowsPlusType.SoftLayer color. Replacing with a fixed neutral (e.g. Color.Black.copy(alpha=0.08f) or MaterialTheme.colorScheme.outline) preserves the shadow shape; verify in manual scroll that thumbnail shadow looks correct."
  - level: low
    title: "remember key for tagStates must invalidate on article.tagsString change"
    body: "The current code keys tagStates on article.itemId only; this plan moves the key to article.tagsString. Verify that toggling a tag from a different screen correctly refreshes the map when the same item reappears in the list."
  - level: low
    title: "Removing unused imports after palette deletion must not leave dangling references"
    body: "ArticleListItem.kt imports LinearEasing, RepeatMode, animateFloat, infiniteRepeatable, rememberInfiniteTransition, tween, DisposableEffect — all become unused. Remove the import block in the same commit to keep the file compileable. Similarly for ArticleThumbnail.kt (allowHardware, Dispatchers, extractPaletteFromBitmap, Brush, coil3.asDrawable)."
