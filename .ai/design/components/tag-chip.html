<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wf:component" content="tag-chip">
<meta name="wf:kind" content="component">
<meta name="wf:variants" content="tone=applied|suggested|selected|available|add">
<meta name="wf:states" content="default hover pressed focus disabled">
<title>Tag chip</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../layout.css">
<link rel="stylesheet" href="../components.css">
<style>
  [data-spec] { width: 100%; max-width: var(--size-dialog); }
  /* Every value is a token. Each panel shows the cells in one theme. */
  body { margin: 0; font-family: var(--font-body); background: var(--ground); color: var(--text); }
  .wf-theme { background: var(--ground); color: var(--text); padding: var(--space-5); }
  .wf-theme::before { content: attr(data-theme); flex-basis: 100%; }
  .wf-theme[hidden] { display: none; }
</style>
</head>
<body>
<section class="wf-theme l-cluster" data-theme="light" data-theme-source>
<div data-spec="tone=applied state=default"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=applied"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=suggested state=default"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=suggested"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=selected state=default"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=selected"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=available state=default"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=available"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=add state=default"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=add" aria-label="Add tag"><svg class="icon-sm" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg></a></div>
<div data-spec="tone=applied state=hover"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=applied" data-ui="hover"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=suggested state=hover"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=suggested" data-ui="hover"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=selected state=hover"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=selected" data-ui="hover"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=available state=hover"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=available" data-ui="hover"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=add state=hover"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=add" data-ui="hover" aria-label="Add tag"><svg class="icon-sm" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg></a></div>
<div data-spec="tone=applied state=pressed"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=applied" data-ui="pressed"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=suggested state=pressed"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=suggested" data-ui="pressed"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=selected state=pressed"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=selected" data-ui="pressed"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=available state=pressed"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=available" data-ui="pressed"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=add state=pressed"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=add" data-ui="pressed" aria-label="Add tag"><svg class="icon-sm" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg></a></div>
<div data-spec="tone=applied state=focus"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=applied" data-ui="focus"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=suggested state=focus"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=suggested" data-ui="focus"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=selected state=focus"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=selected" data-ui="focus"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=available state=focus"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=available" data-ui="focus"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=add state=focus"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=add" data-ui="focus" aria-label="Add tag"><svg class="icon-sm" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg></a></div>
<div data-spec="tone=applied state=disabled"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=applied" data-ui="disabled" aria-disabled="true"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=suggested state=disabled"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=suggested" data-ui="disabled" aria-disabled="true"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=selected state=disabled"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=selected" data-ui="disabled" aria-disabled="true"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=available state=disabled"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=available" data-ui="disabled" aria-disabled="true"><span class="tag-chip__label">databases</span></a></div>
<div data-spec="tone=add state=disabled"><a href="#" class="tag-chip" data-component="tag-chip" data-variant="tone=add" data-ui="disabled" aria-disabled="true" aria-label="Add tag"><svg class="icon-sm" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg></a></div>
</section>
<section class="wf-theme l-cluster" data-theme="dark" data-theme-copy></section>
<script data-wf-themes>
  (() => {
    const panels = [...document.querySelectorAll('section.wf-theme')];
    const source = panels.find((p) => p.dataset.themeSource !== undefined);
    for (const p of panels) if (source && p !== source) p.innerHTML = source.innerHTML;
    const only = new URLSearchParams(location.search).get('theme');
    if (only && panels.some((p) => p.dataset.theme === only)) for (const p of panels) p.hidden = p.dataset.theme !== only;
  })();
</script>
</body>
</html>
