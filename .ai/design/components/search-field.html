<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wf:component" content="search-field">
<meta name="wf:kind" content="component">
<meta name="wf:variants" content="">
<meta name="wf:states" content="default hover pressed focus disabled">
<title>Search field</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../layout.css">
<link rel="stylesheet" href="../components.css">
<style>
  [data-spec] { width: 100%; max-width: var(--size-dialog); }
  /* Every value is a token. Each panel shows the cells in one theme. */
  body { margin: 0; font-family: var(--font-body); background: var(--ground); color: var(--text); }
  .wf-theme { background: var(--ground); color: var(--text); padding: var(--space-5); }
  .wf-theme::before { content: attr(data-theme); flex-basis: 100%; }
  .wf-theme[hidden] { display: none; }
</style>
</head>
<body>
<section class="wf-theme l-cluster" data-theme="light" data-theme-source>
<div data-spec="state=default"><div class="search-field" data-component="search-field"><svg class="icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.500-75.500T120-580q0-109 75.500-184.500T380-840q109 0 184.500 75.500T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.500-52.500T560-580q0-75-52.500-127.500T380-760q-75 0-127.500 52.500T200-580q0 75 52.500 127.500T380-400Z"/></svg><input class="search-field__input" aria-label="Search" placeholder="Search" value=""></div></div>
<div data-spec="state=hover"><div class="search-field" data-component="search-field"><svg class="icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.500-75.500T120-580q0-109 75.500-184.500T380-840q109 0 184.500 75.500T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.500-52.500T560-580q0-75-52.500-127.500T380-760q-75 0-127.500 52.500T200-580q0 75 52.500 127.500T380-400Z"/></svg><input class="search-field__input" aria-label="Search" placeholder="Search" value="" data-ui="hover"></div></div>
<div data-spec="state=pressed"><div class="search-field" data-component="search-field"><svg class="icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.500-75.500T120-580q0-109 75.500-184.500T380-840q109 0 184.500 75.500T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.500-52.500T560-580q0-75-52.500-127.500T380-760q-75 0-127.500 52.500T200-580q0 75 52.500 127.500T380-400Z"/></svg><input class="search-field__input" aria-label="Search" placeholder="Search" value="" data-ui="pressed"></div></div>
<div data-spec="state=focus"><div class="search-field" data-component="search-field"><svg class="icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.500-75.500T120-580q0-109 75.500-184.500T380-840q109 0 184.500 75.500T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.500-52.500T560-580q0-75-52.500-127.500T380-760q-75 0-127.500 52.500T200-580q0 75 52.500 127.500T380-400Z"/></svg><input class="search-field__input" aria-label="Search" placeholder="Search" value="" data-ui="focus"></div></div>
<div data-spec="state=disabled"><div class="search-field" data-component="search-field"><svg class="icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.500-75.500T120-580q0-109 75.500-184.500T380-840q109 0 184.500 75.500T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.500-52.500T560-580q0-75-52.500-127.500T380-760q-75 0-127.500 52.500T200-580q0 75 52.500 127.500T380-400Z"/></svg><input class="search-field__input" aria-label="Search" placeholder="Search" value="" data-ui="disabled" disabled></div></div>
</section>
<section class="wf-theme l-cluster" data-theme="dark" data-theme-copy></section>
<script data-wf-themes>
  (() => {
    const panels = [...document.querySelectorAll('section.wf-theme')];
    const source = panels.find((p) => p.dataset.themeSource !== undefined);
    for (const p of panels) if (source && p !== source) p.innerHTML = source.innerHTML;
    const only = new URLSearchParams(location.search).get('theme');
    if (only && panels.some((p) => p.dataset.theme === only)) for (const p of panels) p.hidden = p.dataset.theme !== only;
  })();
</script>
</body>
</html>
