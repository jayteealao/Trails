<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wf:component" content="overlay">
<meta name="wf:kind" content="layout">
<meta name="wf:variants" content="place=bottom|center">
<meta name="wf:states" content="default">
<title>Overlay (scrim with a sheet or a dialog)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../layout.css">
<link rel="stylesheet" href="../components.css">
<style>
  [data-spec] { position: relative; width: 100%; max-width: var(--size-dialog); height: calc(var(--size-thumb) * 4); transform: translateZ(0); overflow: hidden; }
  /* Every value is a token. Each panel shows the cells in one theme. */
  body { margin: 0; font-family: var(--font-body); background: var(--ground); color: var(--text); }
  .wf-theme { background: var(--ground); color: var(--text); padding: var(--space-5); }
  .wf-theme::before { content: attr(data-theme); flex-basis: 100%; }
  .wf-theme[hidden] { display: none; }
</style>
</head>
<body>
<section class="wf-theme l-cluster" data-theme="light" data-theme-source>
<div data-spec="place=bottom state=default"><div class="overlay" data-component="overlay" data-variant="place=bottom"><a class="overlay__scrim" href="#" aria-label="Close"></a><div class="tag-sheet" data-component="tag-sheet"><h2 class="tag-sheet__title">Manage tags</h2></div></div></div>
<div data-spec="place=center state=default"><div class="overlay" data-component="overlay" data-variant="place=center"><a class="overlay__scrim" href="#" aria-label="Close"></a><div class="tag-sheet" data-component="tag-sheet"><h2 class="tag-sheet__title">Manage tags</h2></div></div></div>
</section>
<section class="wf-theme l-cluster" data-theme="dark" data-theme-copy></section>
<script data-wf-themes>
  (() => {
    const panels = [...document.querySelectorAll('section.wf-theme')];
    const source = panels.find((p) => p.dataset.themeSource !== undefined);
    for (const p of panels) if (source && p !== source) p.innerHTML = source.innerHTML;
    const only = new URLSearchParams(location.search).get('theme');
    if (only && panels.some((p) => p.dataset.theme === only)) for (const p of panels) p.hidden = p.dataset.theme !== only;
  })();
</script>
</body>
</html>
