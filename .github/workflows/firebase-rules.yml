name: Firebase rules tests

on:
  push:
    branches:
      - main
    paths:
      - 'firebase/**'
      - '.github/workflows/firebase-rules.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

jobs:
  # Runs the Firestore and Storage rules tests on the emulators. Rules deploy
  # only through warg/scripts/deploy.sh.
  rules-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: firebase/test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Java (Firestore emulator runtime)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/test/package.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules tests (emulator)
        run: npm test
