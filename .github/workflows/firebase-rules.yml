name: Deploy Firebase rules

on:
  push:
    branches:
      - main
    paths:
      - 'firebase/**'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: firebase

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Firebase token
        id: has_token
        env:
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_TOKEN secret not set; skipping deploy."
          fi

      - name: Setup Node
        if: steps.has_token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install firebase-tools
        if: steps.has_token.outputs.present == 'true'
        run: npm install -g firebase-tools

      - name: Deploy Firestore + Storage rules
        if: steps.has_token.outputs.present == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only firestore:rules,storage --non-interactive
