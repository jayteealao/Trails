name: Android Release on Tag

on:
  push:
    tags:
      - "v*"     # e.g., v1.4.0, v2.0.0-rc.1

# Monorepo layout: Android sources are under android/. All paths in this
# workflow are workspace-rooted (no `defaults.run.working-directory`) so
# that paths emitted to GITHUB_OUTPUT and consumed by GitHub Actions
# (upload-artifact, softprops/action-gh-release) resolve correctly.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases & upload assets
#    env:
#      ACT: ${{ env.ACT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0  # needed to access full git history for changelog

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

          # Windows-safe guard
      - name: Fix gradlew perms & line endings (Windows devs)
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: check for signing secrets
        id: has_signing
        env:
          B64: ${{ secrets.SIGNING_STORE_FILE_B64 }}
        run: |
          if [ -n "$B64" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # --- Optional: Decode keystore & expose signing to Gradle ---
      - name: Decode keystore (optional)
        if: ${{ steps.has_signing.outputs.present == 'true' }}
        env:
          SIGNING_STORE_FILE_B64: ${{ secrets.SIGNING_STORE_FILE_B64 }}
        run: |
          echo "$SIGNING_STORE_FILE_B64" | base64 -d > keystore.jks

      - name: Write signing properties (optional)
        if: ${{ steps.has_signing.outputs.present == 'true' }}
        run: |
          {
            echo "SIGNING_STORE_FILE=$(pwd)/keystore.jks"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}"
          } >> $GITHUB_ENV

      # --- Decode google-services.json ---
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
      
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
          echo "GOOGLE_SERVICES_JSON_B64 is empty."
          exit 1
          fi
      
          mkdir -p android/app

          # 1) Normalize line endings and strip *only* whitespace characters that can
          # appear in secrets files (Windows/act can inject CRLF/newlines).
          # 2) Base64-decode safely.
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" \
          | tr -d '\r\n\t ' \
          | base64 -d > android/app/google-services.json

          # Validate the JSON so we fail fast with a clear error
          if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get update -y && sudo apt-get install -y jq
          fi

          jq type android/app/google-services.json
          echo "google-services.json decoded and valid."

      # Blocking, also under act: a failing unit test stops the job before any
      # APK, AAB or release exists.
      - name: Unit tests
        timeout-minutes: 30
        run: |
          cd android && ./gradlew --no-daemon testDebugUnitTest

      # --- Build (adjust module & tasks as needed) ---
      # If you have flavors, e.g., prod, replace with assembleProdRelease/bundleProdRelease
      - name: Build APK + AAB
        run: |
          cd android && ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: List build outputs (debug)
        if: always()
        run: |
          echo "=== APK outputs ==="
          find . -type f -name "*.apk" -o -name "*.aab" | sort
          echo "=== Mapping files ==="
          find . -type f -name "mapping.txt" || echo "No mapping.txt found"

      # Collect artifacts
      - name: Find outputs
        id: find_outputs
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Find APK (case-insensitive for release/Release)
          APK=$(find . -type f -path "*/build/outputs/apk/*elease/*.apk" ! -name "*-unsigned.apk" ! -name "*-unaligned.apk" | head -n1)
          AAB=$(find . -type f -path "*/build/outputs/bundle/*elease/*.aab" | head -n1)
          MAP=$(find . -type f -path "*/build/outputs/mapping/*elease/mapping.txt" | head -n1 || true)

          echo "Found APK: ${APK}"
          echo "Found AAB: ${AAB}"
          echo "Found Mapping: ${MAP}"

          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          echo "aab=${AAB}" >> "$GITHUB_OUTPUT"
          echo "mapping=${MAP}" >> "$GITHUB_OUTPUT"

        # ── A) Run git-cliff directly when using act ──────────────────────────────────
      - name: Install git-cliff (ACT)
        if: ${{ env.ACT == 'true' }}
        run: |
          set -eux
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.10.1/git-cliff-2.10.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          sudo mv git-cliff*/git-cliff /usr/local/bin/git-cliff

      - name: Generate changelog (ACT)
        if: ${{ env.ACT == 'true' }}
        run: |
          git-cliff --config android/cliff.toml --tag "${{ env.GITHUB_REF_NAME || 'main' }}" \
            -o "CHANGELOG-${{ env.GITHUB_REF_NAME || 'main' }}.md" --verbose

      # ── B) Keep your existing action for real GitHub runs ─────────────────────────
      # --- Optional: pretty CHANGELOG from commits with git-cliff ---
      - name: Generate changelog with git-cliff (optional)
        id: cliff
        if: ${{ env.ACT != 'true' }}  # Skip on ACT runs
        continue-on-error: true
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --config android/cliff.toml --tag ${{ steps.find_outputs.outputs.tag }} --verbose
        env:
          OUTPUT: CHANGELOG-${{ steps.find_outputs.outputs.tag }}.md

      - name: Prepare release body
        id: body
        run: |
          BODY_FILE="RELEASE_BODY.md"
          {
            echo "## Release ${{ steps.find_outputs.outputs.tag }}"
            echo
            if [ -f "CHANGELOG-${{ steps.find_outputs.outputs.tag }}.md" ]; then
              echo "### Changelog"
              echo
              cat "CHANGELOG-${{ steps.find_outputs.outputs.tag }}.md"
            else
              echo "_Auto-generated notes will be used by GitHub._"
            fi
          } > "$BODY_FILE"
          echo "file=${BODY_FILE}" >> "$GITHUB_OUTPUT"

      # Create GitHub Release + upload assets
      - name: Create release & upload assets
        if: ${{ env.ACT != 'true' }}  # Skip on ACT runs
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.find_outputs.outputs.tag }}
          name: ${{ steps.find_outputs.outputs.tag }}
          body_path: ${{ steps.body.outputs.file }}
          generate_release_notes: ${{ !hashFiles(format('CHANGELOG-{0}.md', steps.find_outputs.outputs.tag)) }}
          files: |
            ${{ steps.find_outputs.outputs.apk }}
            ${{ steps.find_outputs.outputs.aab }}
            ${{ steps.find_outputs.outputs.mapping }}
            CHANGELOG-${{ steps.find_outputs.outputs.tag }}.md

      - name: Upload release outputs
        if: ${{ env.ACT == 'true' }}   # only matters locally
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trails-${{ steps.find_outputs.outputs.tag }}
          path: |
            ${{ steps.find_outputs.outputs.apk }}
            ${{ steps.find_outputs.outputs.aab }}
            ${{ steps.find_outputs.outputs.mapping }}
            CHANGELOG-${{ steps.find_outputs.outputs.tag }}.md

  # Verify the published release has its APK/AAB assets attached.
  post-publish:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify GitHub Release assets
        # Skipped under act (no real release is created locally).
        if: ${{ env.ACT != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh needs the repo explicitly: this job has no checkout, so there's
          # no git remote for it to infer from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # build-and-release just created this release, so the check normally
          # passes on the first attempt; the loop only guards against GitHub
          # API propagation lag. Up to 30 min, polling every 60s.
          MAX_WAIT=$(( 30 * 60 ))
          POLL=60
          ELAPSED=0
          while :; do
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            echo "Assets for ${TAG}:"
            echo "${ASSETS:-<none>}"
            if echo "$ASSETS" | grep -qiE '\.apk$' && echo "$ASSETS" | grep -qiE '\.aab$'; then
              echo "Post-publish check passed: APK and AAB are attached."
              exit 0
            fi
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Post-publish check FAILED: APK and/or AAB missing after ${MAX_WAIT}s."
              exit 1
            fi
            sleep "$POLL"
            ELAPSED=$(( ELAPSED + POLL ))
          done

