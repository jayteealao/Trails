name: Android PR Build Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'android/**'
      - 'firebase/**'
      - 'shared-types/**'
      - '.github/workflows/pr-build-check.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test (optional for manual runs)'
        required: false
        type: number

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # needed to comment on PR

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Fix gradlew perms & line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      # --- Decode google-services.json ---
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -d '[:space:]' | base64 -d > app/google-services.json
          echo "File size: $(wc -c < app/google-services.json) bytes"
          echo "First line: $(head -1 app/google-services.json)"
          echo "Last line: $(tail -1 app/google-services.json)"
          if command -v python3 &> /dev/null; then
            python3 -m json.tool app/google-services.json > /dev/null && echo "✓ JSON is valid" || echo "✗ JSON is malformed"
          fi

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          # tee writes to workspace root so actions/github-script (which does
          # NOT honor defaults.run.working-directory) can read it back.
          ./gradlew --no-daemon clean assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
          status=${PIPESTATUS[0]}
          echo "build_status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check build result and comment on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const buildStatus = process.env.BUILD_STATUS;
            const prNumber = process.env.PR_NUMBER;

            // Skip commenting if no PR context (e.g., manual workflow_dispatch without PR number)
            if (!prNumber) {
              console.log('Skipping PR comment: no PR number available');
              console.log(`Build status: ${buildStatus}`);
              if (buildStatus === 'failure') {
                console.log('Build failed - check the workflow logs for details');
                try {
                  const buildLog = fs.readFileSync('build-log.txt', 'utf8');
                  const errorLines = buildLog.split('\n').filter(line =>
                    line.includes('error:') || line.includes('FAILURE:') ||
                    line.includes('BUILD FAILED') || line.includes('Execution failed')
                  );
                  if (errorLines.length > 0) {
                    console.log('Error summary:', errorLines.slice(0, 10).join('\n'));
                  }
                } catch (error) {
                  console.log('Could not read build log');
                }
              }
              return;
            }

            let comment = '';

            if (buildStatus === 'failure') {
              // Read the build log
              let buildLog = '';
              try {
                buildLog = fs.readFileSync('build-log.txt', 'utf8');
              } catch (error) {
                buildLog = 'Could not read build log';
              }

              // Extract relevant error information
              const errorLines = buildLog.split('\n').filter(line =>
                line.includes('error:') ||
                line.includes('FAILURE:') ||
                line.includes('BUILD FAILED') ||
                line.includes('Execution failed')
              );

              // Get the last 50 lines of the log for context
              const logLines = buildLog.split('\n');
              const contextLines = logLines.slice(Math.max(0, logLines.length - 50));

              comment = `## ❌ Build Failed\n\n`;
              comment += `The PR build has failed. Please review and fix the following errors:\n\n`;

              if (errorLines.length > 0) {
                comment += `### Error Summary:\n\`\`\`\n${errorLines.slice(0, 20).join('\n')}\n\`\`\`\n\n`;
              }

              comment += `### Build Log (last 50 lines):\n<details>\n<summary>Click to expand</summary>\n\n\`\`\`\n${contextLines.join('\n')}\n\`\`\`\n</details>\n\n`;
              comment += `Please fix these issues and push your changes to re-trigger the build check.`;
            } else {
              comment = `## ✅ Build Successful\n\nThe PR build completed successfully! The code compiles without errors.`;
            }

            // Post comment on PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
              body: comment
            });

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build failed. Check the PR comment for details."
          exit 1

      - name: Upload build outputs on success
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
