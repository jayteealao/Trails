name: Warg CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'warg/**'
      - 'firebase/**'
      - 'shared-types/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
  push:
    branches:
      - main
    paths:
      - 'warg/**'
      - 'firebase/**'
      - 'shared-types/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'

# Workspace-rooted paths throughout. `warg/` is a pnpm workspace; commands
# run from there so `pnpm -r` picks up the workers/*, packages/*, etc.

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: warg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: warg/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare Workers types
        # Workers tsconfigs reference a generated `worker-configuration.d.ts`
        # produced by `wrangler types` (gitignored). Generate before typecheck.
        run: pnpm -r --if-present run types

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0

      - name: Typecheck all workspace packages
        run: |
          # Each package may have its own tsconfig; iterate via pnpm.
          # `-r` runs across all workspace packages; `--if-present` skips packages
          # without a typecheck script instead of failing.
          pnpm -r --if-present run typecheck

      - name: Unit tests — all workspace packages
        # Runs vitest (node-env) suites across workers/*, packages/*, pages/*,
        # plus workers/logger (Cloudflare Workers pool via workerd), plus
        # cloud-functions node:test suites. Integration suites that need the
        # Firestore emulator are scoped to *.integration.test.* and excluded
        # by each package's own test script. firebase/test lives outside the
        # pnpm workspace and is not included.
        run: pnpm -r --if-present run test

      - name: cf deploy dry run (every worker and the dashboard)
        # Builds and validates each worker from its cloudflare.config.ts
        # without uploading. --dry-run needs no Cloudflare credentials; the
        # monolith run also builds its container image with the runner's Docker.
        # Every worker folder with a cloudflare.config.ts is covered, so a new
        # worker needs no edit here; the dashboard Worker lives in
        # pages/dashboard.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for d in workers/*/ pages/dashboard/; do
            d="${d%/}"
            [ -f "$d/cloudflare.config.ts" ] || continue
            echo "::group::cf deploy --dry-run ($d)"
            if ! (cd "$d" && pnpm exec cf deploy --dry-run); then
              echo "::error::cf deploy --dry-run failed for $d"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Worker configs agree (cloudflare.config.ts and wrangler.jsonc)
        # cf deploy and cf dev read cloudflare.config.ts (and, for the
        # dashboard, wrangler.config.ts); wrangler types, the logger's
        # Workers-pool tests and the remaining wrangler dev runs read
        # wrangler.jsonc. Fails when a binding, Durable Object class, cron,
        # static assets or compatibility setting differs between the two.
        timeout-minutes: 5
        run: |
          node scripts/check-worker-configs.mjs
          node --test scripts/__tests__/worker-configs.test.mjs

      - name: Keys are secrets and no user id is tracked
        # Fails when a cloud function declares a key with defineString or reads
        # one from process.env at module load, or when a tracked text file
        # holds a token shaped like a Firebase user id. Hits print the shape
        # of the token, never the token.
        timeout-minutes: 5
        run: |
          node scripts/check-keys-and-uid.mjs
          node --test scripts/__tests__/keys-and-uid.test.mjs

      - name: No direct article write outside the writer module
        # Fails when a cloud function calls set, update, create or delete on a
        # Firestore document, transaction, batch or bulk writer (or add on a
        # collection) itself: the articles document is written only through
        # @warg/article-writer. A write to another document (a tracker, a
        # marker) passes when its line or the line above carries
        # `// article-write-check: not-an-article (<what it is>)`.
        timeout-minutes: 5
        run: |
          node scripts/check-article-writes.mjs
          node --test scripts/__tests__/article-writes.test.mjs

      - name: Copied function helpers agree
        # Each function bundles alone, so the shared-id shapes, the key compare
        # and the rotation switch are copied; this fails when one copy changes
        # and the others do not, and when a function adds its own link reader
        # or pocket projection instead of importing the article module.
        timeout-minutes: 5
        run: node --test scripts/__tests__/function-copies.test.mjs

      - name: One lease TTL for the quota object and the container sweep
        # The lease TTL and its stale rule live once in the shared package;
        # this fails when either worker defines its own lease TTL or stops
        # importing the shared one.
        timeout-minutes: 5
        run: node --test scripts/__tests__/lease-ttl-source.test.mjs

      - name: One home for the id, domain and storage-path helpers
        # The article id rules, the URL domain helpers and each artifact's
        # storage path live once in the shared package; this fails when a
        # worker, cloud function or dashboard function defines its own copy
        # or stops importing the shared one.
        timeout-minutes: 5
        run: node --test scripts/__tests__/shared-helpers-source.test.mjs

      - name: Cloud function bundles
        # Builds each function's deploy folder (one esbuild bundle plus a
        # generated package.json), then checks it as Cloud Build will use it:
        # exact runtime pins, no workspace or file specifier, express 4.22.2 or
        # later and the workspace overrides in the npm-resolved tree, and the
        # commit SHA logged once when the bundle loads.
        timeout-minutes: 5
        run: |
          pnpm --filter "./cloud-functions/*" --if-present run build:deploy
          node scripts/check-function-bundle.mjs
          node --test scripts/__tests__/function-bundle.test.mjs

      - name: Deploy script lint and harness
        # shellcheck over deploy.sh and its stub harness, then the harness:
        # deploy.sh runs end to end against stub cf, wrangler, firebase,
        # gcloud and pnpm, so the secret preflight, the version, updateTime
        # and commit_hash checks, the dirty-tree refusal and the exit summary
        # are proven on every run without credentials.
        timeout-minutes: 5
        run: pnpm run deploy:check

  emulator-integration:
    # The Firestore-emulator suites the unit step leaves out: the link triggers
    # (user-triggers) and the merge and re-derive passes (backfill-scripts), the
    # scripts that rewrite links and markers with --apply.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: warg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: warg/pnpm-lock.yaml

      - name: Setup Java (Firestore emulator runtime)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('warg/package.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link trigger suites (Firestore emulator)
        timeout-minutes: 15
        run: pnpm --filter @warg/user-triggers run test:emulator

      - name: Merge and re-derive pass suites (Firestore emulator)
        timeout-minutes: 15
        run: >-
          pnpm exec firebase emulators:exec --only firestore --project=demo-trails
          --config=../firebase/firebase.json
          "pnpm --filter @warg/backfill-scripts run test:integration"

  dashboard-e2e:
    # The dashboard's browser checks: the sign-in on every page and route, the
    # archive content policy, the archive preview, the infra view and the
    # inbox, driven in Chromium against the dashboard Worker under a local
    # `cf dev` (cloudflare.config.ts) with test credentials, a stand-in
    # logger (also cf dev) and per-spec stubs (no live service, no
    # Cloudflare account).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: warg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: warg/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the browser checks
        timeout-minutes: 10
        run: pnpm --filter warg-dashboard exec playwright install --with-deps chromium

      - name: Dashboard browser checks
        timeout-minutes: 20
        run: pnpm --filter warg-dashboard test:e2e

      # The two checks below start the real logger (and, for the settle run, the
      # workflow worker in mock mode) under wrangler dev over a fresh local D1
      # (cf dev has no --persist-to), and the dashboard under cf dev.
      # Their ports overlap, so they run one after the other, after the default
      # checks have stopped their servers.
      - name: Stats panel against the local logger
        timeout-minutes: 10
        run: pnpm --filter warg-dashboard test:e2e:logger

      - name: An archive run settles its status on the dashboard
        timeout-minutes: 10
        run: pnpm --filter warg-dashboard test:e2e:settle

  workflow-lint:
    # Every action pinned to a commit SHA with its version comment, no
    # dispatch input interpolated into a shell line, no retired branch in a
    # trigger, no release signing in the pull-request build, and the rules
    # deploy on the firebase-tools version that warg/package.json pins.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - name: Lint self-test
        run: bash .github/scripts/lint-workflows.test.sh

      - name: Lint workflows
        run: bash .github/scripts/lint-workflows.sh
