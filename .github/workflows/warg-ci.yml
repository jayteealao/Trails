name: Warg CI

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]
    paths:
      - 'warg/**'
      - 'firebase/**'
      - 'shared-types/**'
      - '.github/workflows/warg-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'warg/**'
      - 'firebase/**'
      - 'shared-types/**'
      - '.github/workflows/warg-ci.yml'

# Workspace-rooted paths throughout. `warg/` is a pnpm workspace; commands
# run from there so `pnpm -r` picks up the workers/*, packages/*, etc.

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: warg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: warg/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare Workers types
        # Workers tsconfigs reference a generated `worker-configuration.d.ts`
        # produced by `wrangler types` (gitignored). Generate before typecheck.
        run: pnpm -r --if-present run types

      - name: Lint
        run: pnpm exec eslint . --max-warnings=0
        continue-on-error: true  # legacy code may have lint debt; promote to required once clean

      - name: Typecheck all workspace packages
        run: |
          # Each package may have its own tsconfig; iterate via pnpm.
          # `-r` runs across all workspace packages; `--if-present` skips packages
          # without a typecheck script instead of failing.
          pnpm -r --if-present run typecheck

      - name: Unit tests — backfill-scripts (pure, no emulator)
        # Scoped to the one package with a CI-safe pure test suite (node:test).
        # The package's emulator-backed integration suite needs Java + the
        # Firestore emulator and is run on demand, not here. Broaden to a
        # workspace-wide `pnpm -r test` once other packages have CI-safe suites.
        run: pnpm --filter @warg/backfill-scripts test

  shared-types-drift:
    # Runs unconditionally when warg-ci is triggered. The workflow-level
    # paths filter already gates this to PRs that touch warg/firebase/shared-types.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run drift check
        run: node --experimental-strip-types shared-types/check-drift.ts
