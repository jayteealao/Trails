name: Rollback

# Demotes a bad Android GitHub Release so the previous stable release becomes
# "Latest" again. Artifacts are preserved (not deleted) by default.
#
# The Warg backend (Cloudflare Workers + Cloud Functions) is NOT rolled back
# here — its deploy is operator-run, not in CI. Roll those back locally with:
#   pnpm --dir warg exec cf workers deployments list --worker <worker>
#   pnpm --dir warg exec cf workers deployments create --worker <worker> \
#     --versions '[{"version_id":"<previous-version-id>","percentage":100}]'
# per affected worker (cf has no rollback verb for Workers; a deployment of
# the previous version at 100% is the rollback). See docs/runbooks/ and the
# warg deploy script.

on:
  workflow_dispatch:
    inputs:
      bad_version:
        description: 'Release tag to roll back FROM / demote (e.g. v1.10.6)'
        required: true
      reason:
        description: 'Reason for the rollback'
        required: true

permissions:
  contents: write

jobs:
  rollback-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Demote bad release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAD_VERSION: ${{ inputs.bad_version }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          TAG="$BAD_VERSION"
          # Demote (do not destroy): mark as pre-release and clear "latest" so
          # the prior stable release is surfaced again. To fully remove the
          # release and its tag instead, replace the line below with:
          #   gh release delete "$TAG" --yes --cleanup-tag
          gh release edit "$TAG" --prerelease --latest=false
          echo "Demoted ${TAG}: marked pre-release, no longer latest."
          echo "Reason: $REASON"

      - name: Record rollback
        env:
          BAD_VERSION: ${{ inputs.bad_version }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) rolled back ${BAD_VERSION}: ${REASON}"
          } >> .rollback-history.txt || true
          echo "Reminder: roll back the Warg backend separately by redeploying the previous version per worker (cf workers deployments create) if it shipped alongside this release."
