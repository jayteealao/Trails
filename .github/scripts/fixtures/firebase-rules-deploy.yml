# Lint fixture: copied as firebase-rules.yml; the workflow lint must report
# rules-deploy-in-ci.
name: fixture-firebase-rules-deploy
on: workflow_dispatch
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.34.0
      - name: Deploy rules
        run: firebase deploy --only firestore:rules,storage --non-interactive
