# Lint fixture: copied as firebase-rules.yml beside a package.json that pins a
# different firebase-tools. The workflow lint must report firebase-tools-pin.
name: fixture-firebase-rules-mismatch
on: workflow_dispatch
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install firebase-tools
        run: npm install -g firebase-tools@0.0.1
